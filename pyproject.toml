[project]
name = "llm-tetris"
version = "0.1.0"
description = "Tetris engine + step() API for fine-tuning an LLM to play Tetris"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tetris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
