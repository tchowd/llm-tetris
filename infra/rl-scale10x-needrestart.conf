# Package/security updates and all unrelated service restarts remain enabled.
# Remove with this ephemeral worker during final cleanup.
$nrconf{override_rc}->{qr(^llm-tetris-scale10x-continuation\.service$)} = 0;
$nrconf{override_rc}->{qr(^llm-tetris-scale10x-resume-v1\.service$)} = 0;
